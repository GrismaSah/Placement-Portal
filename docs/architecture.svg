<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" rx="16" fill="#f8fafc"/>

  <text x="40" y="46" font-size="22" font-weight="700" fill="#0f172a">JAIN Placement Portal — working model</text>
  <text x="40" y="70" font-size="13" fill="#64748b">Two apps. Local dev: HTTP + a live WebSocket. Production: one Vercel deployment, no WebSocket.</text>

  <!-- Frontend -->
  <g>
    <rect x="40" y="120" width="230" height="130" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="155" y="160" font-size="16" font-weight="700" fill="#3730a3" text-anchor="middle">Frontend</text>
    <text x="155" y="182" font-size="12.5" fill="#4338ca" text-anchor="middle">React 18 + Vite</text>
    <text x="155" y="200" font-size="12.5" fill="#4338ca" text-anchor="middle">Vite dev server, localhost:5173</text>
    <text x="155" y="224" font-size="11.5" fill="#6366f1" text-anchor="middle">Student · Recruiter · Admin UI</text>
  </g>

  <!-- Backend -->
  <g>
    <rect x="430" y="100" width="270" height="180" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="565" y="134" font-size="16" font-weight="700" fill="#065f46" text-anchor="middle">Backend</text>
    <text x="565" y="156" font-size="12.5" fill="#047857" text-anchor="middle">Express REST API — /api/v1/*</text>
    <rect x="455" y="172" width="220" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="565" y="197" font-size="12" fill="#065f46" text-anchor="middle">JWT httpOnly cookie auth</text>
    <rect x="455" y="222" width="220" height="40" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
    <text x="565" y="247" font-size="12" fill="#065f46" text-anchor="middle">Socket.IO — live notifications</text>
  </g>

  <!-- MongoDB -->
  <g>
    <rect x="850" y="40" width="290" height="90" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="995" y="72" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">MongoDB Atlas</text>
    <text x="995" y="92" font-size="12" fill="#1d4ed8" text-anchor="middle">JAIN_PLACEMENT</text>
    <text x="995" y="110" font-size="11" fill="#3b82f6" text-anchor="middle">users · admins · jobs · applications</text>
  </g>

  <!-- GridFS -->
  <g>
    <rect x="850" y="150" width="290" height="70" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="995" y="180" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">GridFS</text>
    <text x="995" y="200" font-size="11.5" fill="#1d4ed8" text-anchor="middle">resume file storage</text>
  </g>

  <!-- Gmail SMTP -->
  <g>
    <rect x="850" y="240" width="290" height="70" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="995" y="270" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">Gmail SMTP</text>
    <text x="995" y="290" font-size="11.5" fill="#dc2626" text-anchor="middle">verification codes · status emails</text>
  </g>

  <!-- Arrows: Frontend -> Backend (API) -->
  <path d="M270,168 L430,168" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="350" y="158" font-size="11" fill="#475569" text-anchor="middle">HTTPS / JSON</text>

  <!-- Arrows: Backend -> Frontend (Socket) -->
  <path d="M430,242 L270,242" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="350" y="260" font-size="11" fill="#475569" text-anchor="middle">WebSocket</text>

  <!-- Backend -> MongoDB -->
  <path d="M700,150 L850,85" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Backend -> GridFS -->
  <path d="M700,180 L850,185" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- Backend -> Gmail -->
  <path d="M700,220 L850,270" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Roles row -->
  <g>
    <rect x="40" y="300" width="660" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="64" y="328" font-size="13" font-weight="700" fill="#0f172a">Three roles, one login system</text>

    <circle cx="80" cy="358" r="5" fill="#6366f1"/>
    <text x="94" y="362" font-size="12" fill="#334155">Student — browses jobs, applies, tracks status</text>

    <circle cx="80" cy="378" r="5" fill="#10b981"/>
    <text x="94" y="382" font-size="12" fill="#334155">Recruiter — posts jobs, reviews applicants (needs Admin approval first)</text>

    <circle cx="420" cy="358" r="5" fill="#f59e0b"/>
    <text x="434" y="362" font-size="12" fill="#334155">Admin — approves recruiters, views analytics</text>

    <circle cx="420" cy="378" r="5" fill="#ef4444"/>
    <text x="434" y="382" font-size="12" fill="#334155">Enrollment allowlist gates Student registration</text>
  </g>

  <!-- Pipeline row -->
  <g>
    <rect x="40" y="410" width="1100" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="64" y="438" font-size="13" font-weight="700" fill="#0f172a">Application pipeline</text>

    <g font-size="12" fill="#334155">
      <text x="64" y="472">Applied</text>
      <path d="M128,468 L168,468" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="176" y="472">Shortlisted</text>
      <path d="M262,468 L302,468" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="310" y="472">Interview</text>
      <path d="M388,468 L428,468" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="436" y="472">Offered</text>
      <path d="M504,468 L544,468" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="552" y="472" font-weight="700" fill="#065f46">Placed</text>
    </g>
    <text x="700" y="472" font-size="11.5" fill="#94a3b8">Rejected / Withdrawn reachable from any stage</text>
  </g>

  <text x="60" y="530" font-size="11.5" fill="#94a3b8">Local dev: frontend on :5173 calls the backend on :4000 directly. Production: jainplacements.vercel.app serves both from one Vercel deployment.</text>
</svg>
