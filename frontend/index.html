<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/jain-favicon.svg" />
    <meta name="theme-color" content="#111E42" />

    <title>JAIN Placement Portal</title>
    <meta
      name="description"
      content="The official placement portal of JAIN (Deemed-to-be University), Bengaluru — connecting students, recruiters and the Training &amp; Placement Office in one place."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="JAIN Placement Portal" />
    <meta
      property="og:description"
      content="Where JAIN talent meets industry. Browse verified openings, track your applications end to end, and connect with recruiters."
    />
    <meta property="og:site_name" content="JAIN (Deemed-to-be University)" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..800;1,14..32,400..600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Paint the correct palette on the first frame. Without this, a user on
      // the dark theme gets a full-page white flash before React mounts.
      (function () {
        try {
          var stored = localStorage.getItem("jain-portal-theme") || "system";
          var dark =
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
